[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drk-shared"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.2",
    "python-jose[cryptography]>=3.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/drk_shared"]
