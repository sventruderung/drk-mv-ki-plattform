  <!-- Qwen3 30B -->
  <rect x="620" y="128" width="520" height="44" rx="6" fill="#E8F5E9" stroke="#1A5C1A" stroke-width="1.5"/>
  <text x="636" y="147" font-size="11" font-weight="bold" fill="#1A5C1A">Qwen3 30B-A3B Q4 (MoE)</text>
  <text x="636" y="163" font-size="10" fill="#555">18 GB · Aktuell geplant · passt locker</text>
  <rect x="950" y="134" width="60" height="26" rx="4" fill="#1A5C1A"/>
  <text x="980" y="151" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">~18 GB</text>
  <rect x="1015" y="134" width="80" height="26" rx="4" fill="#76B900"/>
  <text x="1055" y="151" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">~40 tok/s</text>

