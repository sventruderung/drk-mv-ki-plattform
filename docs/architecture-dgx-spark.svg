  <text x="310" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">128 GB Unified Memory — LPDDR5X</text>
  <text x="310" y="338" text-anchor="middle" font-size="11" fill="#AED6F1">CPU + GPU teilen denselben Speicher · Kein VRAM-Engpass</text>

  <!-- Memory Bandwidth -->
  <rect x="80" y="362" width="460" height="36" rx="6" fill="#0D2040" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="310" y="376" text-anchor="middle" font-size="10" fill="#76B900" font-weight="bold">Memory Bandwidth: 273 GB/s</text>
  <text x="310" y="390" text-anchor="middle" font-size="10" fill="#aaa">4 TB NVMe SSD · NVIDIA DGX OS (Ubuntu) · Ollama + CUDA nativ</text>

  <!-- Key stat -->
  <rect x="80" y="410" width="460" height="36" rx="6" fill="#003300" stroke="#76B900" stroke-width="1.5"/>
  <text x="310" y="424" text-anchor="middle" font-size="10" fill="#76B900" font-weight="bold">Preis: ca. 3.500–4.500 € · Verbrauch: ~60–100 W Idle · 300 W Peak</text>
  <text x="310" y="440" text-anchor="middle" font-size="10" fill="#aaa">Kompaktes Mini-Formfaktor · Kein Rack erforderlich · Bürobetrieb möglich</text>

