  <rect x="950" y="238" width="60" height="26" rx="4" fill="#1565C0"/>
  <text x="980" y="255" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">~40 GB</text>
  <rect x="1015" y="238" width="80" height="26" rx="4" fill="#76B900"/>
  <text x="1055" y="255" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">~15 tok/s</text>

