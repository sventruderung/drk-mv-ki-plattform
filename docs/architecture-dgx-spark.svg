  <rect x="936" y="348" width="196" height="16" rx="3" fill="#E8F5E9" stroke="#1A5C1A" stroke-width="1"/>
  <text x="1034" y="360" text-anchor="middle" font-size="8" fill="#1A5C1A">Frei: ~56 GB</text>
