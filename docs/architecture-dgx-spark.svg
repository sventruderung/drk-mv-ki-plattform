  <line x1="580" y1="545" x2="580" y2="640" stroke="#C0392B" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="535" y="652" text-anchor="middle" font-size="9" fill="#C0392B">Lastenheft-Grenze: 2 s</text>

