  <rect x="620" y="180" width="520" height="44" rx="6" fill="#FFF9C4" stroke="#F9A825" stroke-width="2.5"/>
  <text x="636" y="199" font-size="11" font-weight="bold" fill="#E65100">⭐ Qwen3 72B Q4 — EMPFOHLEN</text>
  <text x="636" y="215" font-size="10" fill="#555">42 GB · Beste Qualität Deutsch · passt komfortabel</text>
  <rect x="950" y="186" width="60" height="26" rx="4" fill="#E65100"/>
  <text x="980" y="203" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">~42 GB</text>
  <rect x="1015" y="186" width="80" height="26" rx="4" fill="#76B900"/>
  <text x="1055" y="203" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">~15 tok/s</text>

