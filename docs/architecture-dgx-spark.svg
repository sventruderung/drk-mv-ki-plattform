  <rect x="600" y="80" width="560" height="380" rx="12" fill="#fff" stroke="#2E75B6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="600" y="80" width="560" height="36" rx="12" fill="#1F4E79"/>
  <rect x="600" y="104" width="560" height="12" fill="#1F4E79"/>
  <text x="880" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Modell-Fit auf 128 GB Unified Memory</text>

