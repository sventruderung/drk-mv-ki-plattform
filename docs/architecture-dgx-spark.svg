<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E75B6"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1A7A1A"/>
    </marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#B8860B"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000033"/>
    </filter>
    <linearGradient id="nvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#76B900"/>
      <stop offset="100%" style="stop-color:#1A5C00"/>
    </linearGradient>
    <linearGradient id="memGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9"/>
      <stop offset="100%" style="stop-color:#1F4E79"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#F0F4F8"/>

  <!-- Title -->
  <text x="600" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F4E79">DRK MV KI-Plattform — Hardware-Profil: NVIDIA DGX Spark (GB10)</text>
  <text x="600" y="56" text-anchor="middle" font-size="12" fill="#888">ST COMPUTER GmbH · Mono-Installation mit P02 + P03 · Performance-Analyse</text>
  <line x1="60" y1="66" x2="1140" y2="66" stroke="#76B900" stroke-width="2"/>

  <!-- ── DGX SPARK HARDWARE BOX ── -->
  <rect x="60" y="80" width="500" height="380" rx="12" fill="#1A1A2E" stroke="#76B900" stroke-width="3" filter="url(#shadow)"/>
  <rect x="60" y="80" width="500" height="44" rx="12" fill="url(#nvGrad)"/>
  <rect x="60" y="112" width="500" height="12" fill="url(#nvGrad)"/>
  <text x="310" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">NVIDIA DGX Spark — GB10 Grace Blackwell</text>

  <!-- GPU Core -->
  <rect x="80" y="140" width="220" height="140" rx="8" fill="#0D0D1A" stroke="#76B900" stroke-width="2"/>
  <text x="190" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#76B900">Blackwell GPU (B10)</text>
  <text x="190" y="180" text-anchor="middle" font-size="10" fill="#aaa">1 PFLOPS FP4</text>
  <text x="190" y="196" text-anchor="middle" font-size="10" fill="#aaa">500 TOPS FP8</text>
  <text x="190" y="212" text-anchor="middle" font-size="10" fill="#aaa">200 TFLOPS BF16</text>
  <text x="190" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#76B900">CUDA · Tensor Cores</text>
  <text x="190" y="250" text-anchor="middle" font-size="10" fill="#aaa">5th Gen NVLink</text>
  <text x="190" y="266" text-anchor="middle" font-size="10" fill="#aaa">Native FP8 Inference</text>

  <!-- CPU Core -->
  <rect x="320" y="140" width="220" height="140" rx="8" fill="#0D0D1A" stroke="#4A90D9" stroke-width="2"/>
  <text x="430" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#4A90D9">Grace CPU (ARM)</text>
  <text x="430" y="180" text-anchor="middle" font-size="10" fill="#aaa">Neoverse V2</text>
  <text x="430" y="196" text-anchor="middle" font-size="10" fill="#aaa">20 Cores · 3.1 GHz</text>
  <text x="430" y="212" text-anchor="middle" font-size="10" fill="#aaa">Docker Compose</text>
  <text x="430" y="228" text-anchor="middle" font-size="10" fill="#aaa">FastAPI Services</text>
  <text x="430" y="244" text-anchor="middle" font-size="10" fill="#aaa">PostgreSQL + pgvector</text>
  <text x="430" y="260" text-anchor="middle" font-size="10" fill="#aaa">Keycloak · MinIO</text>

  <!-- Unified Memory Bar -->
