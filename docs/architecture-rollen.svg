  <!-- Background -->
  <rect width="1200" height="980" fill="#F7F9FC"/>

  <!-- Title -->
  <text x="600" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F4E79">DRK MV KI-Plattform — Rollen-, Rechte- und Zugriffskonzept (§4)</text>
  <text x="600" y="56" text-anchor="middle" font-size="12" fill="#888">ST COMPUTER GmbH · Lastenheft §4.1 + §4.2 · Version 0.1.0</text>
  <line x1="60" y1="66" x2="1140" y2="66" stroke="#2E75B6" stroke-width="2"/>

  <!-- ═══════════════════════════════════════════════════
       EBENE 1: SYSTEM (LV MV / Super-Admin)
       ═══════════════════════════════════════════════════ -->
  <rect x="60" y="78" width="1080" height="20" rx="4" fill="#1F4E79"/>
  <text x="600" y="93" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">EBENE 1 — System (DRK Landesverband MV)</text>

  <rect x="380" y="104" width="440" height="86" rx="10" fill="#FADBD8" stroke="#C0392B" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="380" y="104" width="440" height="28" rx="10" fill="#C0392B"/>
  <rect x="380" y="122" width="440" height="10" fill="#C0392B"/>
  <text x="600" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Super-Administrator</text>
  <text x="440" y="148" font-size="10" fill="#7B241C">✔  Neue Mandanten (KV) anlegen / deaktivieren</text>
  <text x="440" y="163" font-size="10" fill="#7B241C">✔  Systemressourcen überwachen · LLM-Modelle aktualisieren</text>
  <text x="440" y="178" font-size="10" fill="#C0392B" font-weight="bold">✘  Kein automatischer Einblick in Mandanten-Dokumente</text>

  <!-- Keycloak label -->
  <rect x="880" y="110" width="230" height="72" rx="6" fill="#fff" stroke="#C0392B" stroke-width="1.5"/>
  <text x="995" y="129" text-anchor="middle" font-size="11" font-weight="bold" fill="#C0392B">Keycloak 24</text>
  <text x="995" y="146" text-anchor="middle" font-size="10" fill="#555">Realm: drk-system</text>
  <text x="995" y="161" text-anchor="middle" font-size="10" fill="#555">Rolle: super-admin</text>
  <text x="995" y="176" text-anchor="middle" font-size="10" fill="#555">SSO · OAuth2 / OIDC</text>

  <!-- Arrow: Super-Admin → Mandate -->
  <line x1="600" y1="190" x2="600" y2="218" stroke="#C0392B" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="610" y="210" font-size="10" fill="#C0392B">anlegen</text>

  <!-- ═══════════════════════════════════════════════════
       EBENE 2: MANDANTEN (KV-Ebene)
       ═══════════════════════════════════════════════════ -->
  <rect x="60" y="222" width="1080" height="20" rx="4" fill="#2E75B6"/>
  <text x="600" y="237" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">EBENE 2 — Mandanten (DRK-Kreisverbände) · Strikte Isolation zwischen allen KV</text>

  <!-- KV Parchim -->
  <rect x="70" y="248" width="330" height="130" rx="10" fill="#EAF2FB" stroke="#2E75B6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="70" y="248" width="330" height="26" rx="10" fill="#2E75B6"/>
  <rect x="70" y="264" width="330" height="10" fill="#2E75B6"/>
  <text x="235" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Mandant: KV Parchim</text>
  <rect x="90" y="284" width="290" height="82" rx="6" fill="#fff" stroke="#2E75B6" stroke-width="1"/>
  <text x="235" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F4E79">Mandanten-Administrator</text>
  <text x="100" y="316" font-size="10" fill="#333">✔  Nutzer anlegen / deaktivieren</text>
  <text x="100" y="330" font-size="10" fill="#333">✔  Rechtegruppen definieren</text>
  <text x="100" y="344" font-size="10" fill="#333">✔  Dokumentenordner verwalten</text>
  <text x="100" y="358" font-size="10" fill="#333">✔  Prompt-Vorlagen anlegen (No-Code)</text>

  <!-- KV Rostock -->
  <rect x="435" y="248" width="330" height="130" rx="10" fill="#EAF2FB" stroke="#2E75B6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="435" y="248" width="330" height="26" rx="10" fill="#2E75B6"/>
  <rect x="435" y="264" width="330" height="10" fill="#2E75B6"/>
  <text x="600" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Mandant: KV Rostock</text>
  <rect x="455" y="284" width="290" height="82" rx="6" fill="#fff" stroke="#2E75B6" stroke-width="1"/>
  <text x="600" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F4E79">Mandanten-Administrator</text>
  <text x="465" y="316" font-size="10" fill="#333">✔  Nutzer anlegen / deaktivieren</text>
  <text x="465" y="330" font-size="10" fill="#333">✔  Rechtegruppen definieren</text>
  <text x="465" y="344" font-size="10" fill="#333">✔  Dokumentenordner verwalten</text>
  <text x="465" y="358" font-size="10" fill="#333">✔  Prompt-Vorlagen anlegen (No-Code)</text>

  <!-- weitere KV (gestrichelt) -->
  <rect x="800" y="248" width="330" height="130" rx="10" fill="#F8F8F8" stroke="#BBBBBB" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="965" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#aaa">13 weitere KV</text>
  <text x="965" y="290" text-anchor="middle" font-size="10" fill="#bbb">KV Stralsund · KV Greifswald</text>
  <text x="965" y="306" text-anchor="middle" font-size="10" fill="#bbb">KV Schwerin · KV Neubrandenburg</text>
  <text x="965" y="322" text-anchor="middle" font-size="10" fill="#bbb">KV Güstrow · KV Demmin · ...</text>
  <text x="965" y="344" text-anchor="middle" font-size="11" fill="#C0392B" font-weight="bold">Vollständig isoliert</text>
  <text x="965" y="360" text-anchor="middle" font-size="10" fill="#bbb">PostgreSQL RLS · tenant_id</text>
  <text x="965" y="372" text-anchor="middle" font-size="10" fill="#bbb">aus JWT-Claims</text>

  <!-- Trennung-Pfeile -->
  <line x1="400" y1="313" x2="435" y2="313" stroke="#C0392B" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="765" y1="313" x2="800" y2="313" stroke="#C0392B" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="417" y="308" text-anchor="middle" font-size="9" fill="#C0392B">ISOLIERT</text>
  <text x="782" y="308" text-anchor="middle" font-size="9" fill="#C0392B">ISOLIERT</text>

