  <text x="685" y="456" text-anchor="middle" font-size="10" fill="#1F4E79">Rettungsdienstleitung · Disponenten</text>
  <text x="685" y="470" text-anchor="middle" font-size="9" fill="#555">Dokument-Zugriff:</text>
  <text x="685" y="484" text-anchor="middle" font-size="10" fill="#2E75B6" font-weight="bold">RD-Handbücher · Einsatzprotokolle</text>
  <text x="685" y="498" text-anchor="middle" font-size="9" fill="#333">Alarmierungspläne · Standards</text>
  <text x="685" y="512" text-anchor="middle" font-size="9" fill="#C0392B">✘ Kein Zugriff: Pflege, Finanzen</text>
  <text x="685" y="528" text-anchor="middle" font-size="9" fill="#888">Keycloak-Rolle: kv-rettungsdienst</text>

  <!-- Nutzer-Gruppe 4: Alle Mitarbeitenden -->
  <rect x="820" y="418" width="230" height="120" rx="8" fill="#D5F5E3" stroke="#1A5C1A" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="820" y="418" width="230" height="24" rx="8" fill="#1A5C1A"/>
  <rect x="820" y="432" width="230" height="10" fill="#1A5C1A"/>
  <text x="935" y="432" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Gruppe: Alle Mitarbeitenden</text>
  <text x="935" y="456" text-anchor="middle" font-size="10" fill="#1A5C1A">Haupt- und Ehrenamtliche</text>
  <text x="935" y="470" text-anchor="middle" font-size="9" fill="#555">Dokument-Zugriff:</text>
  <text x="935" y="484" text-anchor="middle" font-size="10" fill="#1A5C1A" font-weight="bold">Offen freigegebene Dokumente</text>
  <text x="935" y="498" text-anchor="middle" font-size="9" fill="#333">Interne Mitteilungen · Formulare</text>
  <text x="935" y="512" text-anchor="middle" font-size="9" fill="#C0392B">✘ Keine vertraulichen Bereiche</text>
  <text x="935" y="528" text-anchor="middle" font-size="9" fill="#888">Keycloak-Rolle: kv-standard</text>

  <!-- ═══════════════════════════════════════════════════
       EBENE 4: RECHTEGEPRÜFTE RAG-ANFRAGE
       ═══════════════════════════════════════════════════ -->
  <rect x="60" y="552" width="1080" height="20" rx="4" fill="#7D3C98"/>
  <text x="600" y="567" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">EBENE 4 — Rechtegeprüfte RAG-Anfrage (Lastenheft §4.2 · §7 Abnahmekriterium)</text>

  <!-- Nutzer schickt Anfrage -->
  <rect x="70" y="580" width="190" height="60" rx="8" fill="#EAF2FB" stroke="#2E75B6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="165" y="602" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F4E79">Nutzer (Pflege)</text>
  <text x="165" y="617" text-anchor="middle" font-size="10" fill="#333">stellt RAG-Anfrage</text>
  <text x="165" y="630" text-anchor="middle" font-size="10" fill="#555">"Was steht im Handbuch?"</text>

  <line x1="260" y1="610" x2="300" y2="610" stroke="#2E75B6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- JWT-Check -->
  <rect x="300" y="580" width="170" height="60" rx="8" fill="#FEF9E7" stroke="#E67E22" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="385" y="600" text-anchor="middle" font-size="11" font-weight="bold" fill="#D35400">JWT-Prüfung</text>
  <text x="385" y="615" text-anchor="middle" font-size="9" fill="#7D6608">tenant_id aus Token</text>
  <text x="385" y="629" text-anchor="middle" font-size="9" fill="#7D6608">Rollen aus Token</text>

  <line x1="470" y1="610" x2="510" y2="610" stroke="#2E75B6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Rechte-Filter -->
  <rect x="510" y="580" width="200" height="60" rx="8" fill="#FADBD8" stroke="#C0392B" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="610" y="599" text-anchor="middle" font-size="11" font-weight="bold" fill="#C0392B">ACL-Filter</text>
  <text x="610" y="614" text-anchor="middle" font-size="9" fill="#7B241C">Nur Docs mit Rolle kv-pflege</text>
  <text x="610" y="628" text-anchor="middle" font-size="9" fill="#7B241C">PostgreSQL RLS + pgvector</text>

  <line x1="710" y1="610" x2="750" y2="610" stroke="#1A7A1A" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Gefilterte Vektor-Suche -->
  <rect x="750" y="580" width="200" height="60" rx="8" fill="#D5F5E3" stroke="#1A5C1A" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="850" y="599" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A5C1A">Gefilterte Suche</text>
  <text x="850" y="614" text-anchor="middle" font-size="9" fill="#1A5C1A">Nur freigegebene Docs</text>
  <text x="850" y="628" text-anchor="middle" font-size="9" fill="#555">Quelle + Seite + Absatz</text>

  <line x1="950" y1="610" x2="990" y2="610" stroke="#1A7A1A" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Antwort mit Zitat -->
  <rect x="990" y="580" width="150" height="60" rx="8" fill="#D5F5E3" stroke="#1A5C1A" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="1065" y="599" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A5C1A">Antwort</text>
  <text x="1065" y="614" text-anchor="middle" font-size="9" fill="#1A5C1A">Text + Quellenangabe</text>
  <text x="1065" y="628" text-anchor="middle" font-size="9" fill="#555">Dok · Seite · Absatz</text>

  <!-- Blockiert-Pfeil für vertrauliche Docs -->
  <rect x="510" y="652" width="200" height="44" rx="6" fill="#FADBD8" stroke="#C0392B" stroke-width="1.5"/>
  <text x="610" y="670" text-anchor="middle" font-size="10" font-weight="bold" fill="#C0392B">Blockiert:</text>
  <text x="610" y="685" text-anchor="middle" font-size="9" fill="#7B241C">Finanzen · Personal · Vorstand-Docs</text>
  <line x1="610" y1="640" x2="610" y2="652" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>

  <!-- ═══════════════════════════════════════════════════
       EBENE 5: DOKUMENT-KLASSIFIZIERUNG
       ═══════════════════════════════════════════════════ -->
  <rect x="60" y="710" width="1080" height="20" rx="4" fill="#444444"/>
  <text x="600" y="725" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">EBENE 5 — Dokument-Klassifizierung (Beispiel: Wissensbasis KV Parchim)</text>

  <!-- Doc-Klasse 1 -->
  <rect x="70" y="736" width="230" height="76" rx="6" fill="#FADBD8" stroke="#C0392B" stroke-width="1.5"/>
  <text x="185" y="756" text-anchor="middle" font-size="11" font-weight="bold" fill="#C0392B">Vertraulich — Vorstand</text>
  <text x="185" y="773" text-anchor="middle" font-size="10" fill="#333">Finanzdaten · Personalakten</text>
  <text x="185" y="787" text-anchor="middle" font-size="10" fill="#333">Strategiepapiere</text>
  <text x="185" y="802" text-anchor="middle" font-size="9" fill="#888">ACL: kv-vorstand, kv-admin</text>

  <!-- Doc-Klasse 2 -->
  <rect x="320" y="736" width="230" height="76" rx="6" fill="#EAF2FB" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="435" y="756" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E75B6">Fachbereich Pflege</text>
  <text x="435" y="773" text-anchor="middle" font-size="10" fill="#333">Pflegestandards · Fallberichte</text>
  <text x="435" y="787" text-anchor="middle" font-size="10" fill="#333">Dienstpläne Pflege</text>
  <text x="435" y="802" text-anchor="middle" font-size="9" fill="#888">ACL: kv-pflege, kv-admin, kv-vorstand</text>

  <!-- Doc-Klasse 3 -->
  <rect x="570" y="736" width="230" height="76" rx="6" fill="#EAF2FB" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="685" y="756" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E75B6">Bereichsl. Rettungsdienst</text>
  <text x="685" y="773" text-anchor="middle" font-size="10" fill="#333">RD-Handbücher · Protokolle</text>
  <text x="685" y="787" text-anchor="middle" font-size="10" fill="#333">Alarmierungspläne</text>
  <text x="685" y="802" text-anchor="middle" font-size="9" fill="#888">ACL: kv-rettungsdienst, kv-admin, kv-vorstand</text>

  <!-- Doc-Klasse 4 -->
  <rect x="820" y="736" width="230" height="76" rx="6" fill="#D5F5E3" stroke="#1A5C1A" stroke-width="1.5"/>
  <text x="935" y="756" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A5C1A">Offen — Alle Mitarbeitenden</text>
  <text x="935" y="773" text-anchor="middle" font-size="10" fill="#333">Interne Mitteilungen · Formulare</text>
  <text x="935" y="787" text-anchor="middle" font-size="10" fill="#333">Organigramm · Veranstaltungen</text>
  <text x="935" y="802" text-anchor="middle" font-size="9" fill="#888">ACL: kv-standard (alle)</text>

  <!-- ═══════════════════════════════════════════════════
       FOOTER: COMPLIANCE
       ═══════════════════════════════════════════════════ -->
  <rect x="60" y="826" width="1080" height="56" rx="6" fill="#FFF3CD" stroke="#FFC107" stroke-width="1.2"/>
  <text x="80" y="846" font-size="10.5" fill="#7D6608">
    <tspan font-weight="bold">Technische Umsetzung: </tspan>
    <tspan>Keycloak 24 (JWT · OIDC · OAuth2 · AD-Integration) · PostgreSQL RLS (tenant_id + doc_acl) · pgvector-Filter bei jeder Suche</tspan>
  </text>
  <text x="80" y="862" font-size="10.5" fill="#7D6608">
    <tspan font-weight="bold">Compliance: </tspan>
    <tspan>DSGVO Art. 9 · §35 SGB I · Kein Prompt-Logging · Audit-Log für Rechtevergabe · Pentest-Pflicht (Abnahme §7)</tspan>
  </text>
  <text x="80" y="878" font-size="10.5" fill="#C0392B">
    <tspan font-weight="bold">Abnahmekriterium §7: </tspan>
    <tspan>Pentest belegt Mandantentrennung · RAG-Rechtetest: Nutzer ohne Berechtigung erhält keine geschützten Inhalte</tspan>
  </text>
</svg>
