       EBENE 3: NUTZER & RECHTEGRUPPEN (KV Parchim detail)
       ═══════════════════════════════════════════════════ -->
  <rect x="60" y="392" width="1080" height="20" rx="4" fill="#1A5C1A"/>
  <text x="600" y="407" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">EBENE 3 — Nutzer &amp; Rechtegruppen (Beispiel: KV Parchim · Lastenheft §4.2)</text>

  <!-- Nutzer-Gruppe 1: Vorstand -->
  <rect x="70" y="418" width="230" height="120" rx="8" fill="#FADBD8" stroke="#C0392B" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="70" y="418" width="230" height="24" rx="8" fill="#C0392B"/>
  <rect x="70" y="432" width="230" height="10" fill="#C0392B"/>
  <text x="185" y="432" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Gruppe: KV-Vorstand</text>
  <text x="185" y="456" text-anchor="middle" font-size="10" fill="#7B241C">Vorsitzende · Stellvertreter</text>
  <text x="185" y="470" text-anchor="middle" font-size="9" fill="#555">Dokument-Zugriff:</text>
  <text x="185" y="484" text-anchor="middle" font-size="10" fill="#C0392B" font-weight="bold">Alle Dokumente inkl. vertraulich</text>
  <text x="185" y="498" text-anchor="middle" font-size="9" fill="#333">Finanzen · Strategie · Personal</text>
  <text x="185" y="514" text-anchor="middle" font-size="9" fill="#333">Alle KI-Funktionen</text>
  <text x="185" y="530" text-anchor="middle" font-size="9" fill="#888">Keycloak-Rolle: kv-vorstand</text>

  <!-- Nutzer-Gruppe 2: Pflege -->
  <rect x="320" y="418" width="230" height="120" rx="8" fill="#EAF2FB" stroke="#2E75B6" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="320" y="418" width="230" height="24" rx="8" fill="#2E75B6"/>
  <rect x="320" y="432" width="230" height="10" fill="#2E75B6"/>
  <text x="435" y="432" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Gruppe: Fachbereich Pflege</text>
  <text x="435" y="456" text-anchor="middle" font-size="10" fill="#1F4E79">Pflegedienstleitungen · Pflegekräfte</text>
  <text x="435" y="470" text-anchor="middle" font-size="9" fill="#555">Dokument-Zugriff:</text>
  <text x="435" y="484" text-anchor="middle" font-size="10" fill="#2E75B6" font-weight="bold">Pflege-Dokumente · Pflegestandards</text>
  <text x="435" y="498" text-anchor="middle" font-size="9" fill="#333">Dienstpläne · Fallberichte</text>
  <text x="435" y="512" text-anchor="middle" font-size="9" fill="#C0392B">✘ Kein Zugriff: Finanzen, Personal</text>
  <text x="435" y="528" text-anchor="middle" font-size="9" fill="#888">Keycloak-Rolle: kv-pflege</text>

  <!-- Nutzer-Gruppe 3: Rettungsdienst -->
  <rect x="570" y="418" width="230" height="120" rx="8" fill="#EAF2FB" stroke="#2E75B6" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="570" y="418" width="230" height="24" rx="8" fill="#2E75B6"/>
  <rect x="570" y="432" width="230" height="10" fill="#2E75B6"/>
