  <text x="530" y="114" text-anchor="middle" font-size="11" fill="#555">Browser / Tablet  ·  lokales Netz oder VPN</text>

  <!-- Arrow down -->
  <line x1="530" y1="124" x2="530" y2="152" stroke="#2E75B6" stroke-width="2" marker-end="url(#arrow)"/>

