  <text x="530" y="183" text-anchor="middle" font-size="10" fill="#AED6F1">Chat · Dokument-Upload · Prompt-Templates</text>

  <!-- Arrow down -->
  <line x1="530" y1="192" x2="530" y2="218" stroke="#2E75B6" stroke-width="2" marker-end="url(#arrow)"/>

