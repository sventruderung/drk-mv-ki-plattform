  <rect x="790" y="316" width="230" height="10" fill="#F9A825"/>
  <text x="905" y="319" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Integration-Service  :8004</text>
  <text x="905" y="338" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">NEU</text>
  <text x="905" y="352" text-anchor="middle" font-size="10" fill="#444">Tool-Registry · Connector-Pool</text>
  <text x="905" y="367" text-anchor="middle" font-size="10" fill="#444">Circuit Breaker · Secrets-Proxy</text>

