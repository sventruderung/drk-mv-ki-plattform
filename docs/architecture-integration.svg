  <text x="530" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">API-Gateway  (Port 8000)</text>
  <text x="530" y="254" text-anchor="middle" font-size="11" fill="#D6E4F0">JWT-Validierung · Tenant-Isolation · Routing · Streaming</text>

