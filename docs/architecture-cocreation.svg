<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="1100" height="820" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E75B6"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C0392B"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1A7A1A"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D35400"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="820" fill="#F7F9FC"/>

  <!-- Title -->
  <text x="550" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F4E79">DRK MV KI-Plattform — Co-Creation-Workshop-Zyklus (P-01)</text>
  <text x="550" y="56" text-anchor="middle" font-size="12" fill="#888">ST COMPUTER GmbH · Agiles Entwicklungsmodell · Lastenheft §5.1 · Version 0.1.0</text>
  <line x1="60" y1="66" x2="1040" y2="66" stroke="#2E75B6" stroke-width="2"/>

  <!-- ── AKTEURE (oben) ── -->
  <!-- DRK LV MV -->
  <rect x="60" y="82" width="220" height="72" rx="8" fill="#C0392B" filter="url(#shadow)"/>
  <text x="170" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">DRK LV MV</text>
  <text x="170" y="126" text-anchor="middle" font-size="10" fill="#FADBD8">Auftraggeber · Super-Admin</text>
  <text x="170" y="141" text-anchor="middle" font-size="10" fill="#FADBD8">Product Owner (Gesamtplattform)</text>

  <!-- DRK Kreisverbände -->
  <rect x="310" y="82" width="220" height="72" rx="8" fill="#2E75B6" filter="url(#shadow)"/>
  <text x="420" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">DRK Kreisverbände</text>
  <text x="420" y="126" text-anchor="middle" font-size="10" fill="#D6E4F0">15 KV in MV</text>
  <text x="420" y="141" text-anchor="middle" font-size="10" fill="#D6E4F0">Nutzer · Feedback-Geber · PO pro KV</text>

  <!-- ST COMPUTER GmbH -->
  <rect x="560" y="82" width="220" height="72" rx="8" fill="#1A5C1A" filter="url(#shadow)"/>
  <text x="670" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">ST COMPUTER GmbH</text>
  <text x="670" y="126" text-anchor="middle" font-size="10" fill="#D5F5E3">Systemhersteller · Entwicklung</text>
  <text x="670" y="141" text-anchor="middle" font-size="10" fill="#D5F5E3">Scrum Master · Technischer Lead</text>

  <!-- DRK-IT / Betrieb -->
  <rect x="810" y="82" width="220" height="72" rx="8" fill="#7D3C98" filter="url(#shadow)"/>
  <text x="920" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">DRK-IT / Betrieb</text>
  <text x="920" y="126" text-anchor="middle" font-size="10" fill="#E8DAEF">Infrastruktur · Deployment</text>
  <text x="920" y="141" text-anchor="middle" font-size="10" fill="#E8DAEF">Monitoring · Incidents</text>

  <!-- ── HAUPTZYKLUS (Mitte) ── -->
  <!-- Hintergrund-Ellipse für Zyklus-Gefühl -->
  <ellipse cx="550" cy="430" rx="430" ry="210" fill="none" stroke="#D6E4F0" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- Phasen-Boxen im Uhrzeigersinn -->

  <!-- Phase 1: Discovery Workshop (oben links) -->
  <rect x="80" y="210" width="220" height="90" rx="10" fill="#EAF2FB" stroke="#2E75B6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="80" y="210" width="220" height="28" rx="10" fill="#2E75B6"/>
  <rect x="80" y="228" width="220" height="10" fill="#2E75B6"/>
  <text x="190" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">1. Discovery-Workshop</text>
  <text x="190" y="252" text-anchor="middle" font-size="10" fill="#333">Anforderungen sammeln</text>
  <text x="190" y="266" text-anchor="middle" font-size="10" fill="#333">Prioritäten setzen</text>
  <text x="190" y="280" text-anchor="middle" font-size="10" fill="#555">Dauer: 1 Tag · alle 6 Wochen</text>

  <!-- Phase 2: Backlog Refinement (oben rechts) -->
  <rect x="800" y="210" width="220" height="90" rx="10" fill="#EAF2FB" stroke="#2E75B6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="800" y="210" width="220" height="28" rx="10" fill="#2E75B6"/>
  <rect x="800" y="228" width="220" height="10" fill="#2E75B6"/>
  <text x="910" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">2. Backlog-Refinement</text>
  <text x="910" y="252" text-anchor="middle" font-size="10" fill="#333">User Stories verfeinern</text>
  <text x="910" y="266" text-anchor="middle" font-size="10" fill="#333">Akzeptanzkriterien</text>
  <text x="910" y="280" text-anchor="middle" font-size="10" fill="#555">Dauer: 2–4 Std. · wöchentlich</text>

  <!-- Phase 3: Sprint (links Mitte) -->
  <rect x="60" y="380" width="240" height="100" rx="10" fill="#D5F5E3" stroke="#1A5C1A" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="380" width="240" height="28" rx="10" fill="#1A5C1A"/>
  <rect x="60" y="398" width="240" height="10" fill="#1A5C1A"/>
  <text x="180" y="398" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">3. Sprint-Entwicklung</text>
  <text x="180" y="422" text-anchor="middle" font-size="10" fill="#1A5C1A">2 Wochen Sprint</text>
  <text x="180" y="436" text-anchor="middle" font-size="10" fill="#333">Feature-Entwicklung</text>
  <text x="180" y="450" text-anchor="middle" font-size="10" fill="#333">Code Review · CI/CD</text>
  <text x="180" y="464" text-anchor="middle" font-size="10" fill="#555">Staging-Deployment</text>

  <!-- Phase 4: Review / Demo (rechts Mitte) -->
  <rect x="800" y="380" width="240" height="100" rx="10" fill="#FEF9E7" stroke="#D35400" stroke-width="2" filter="url(#shadow)"/>
  <rect x="800" y="380" width="240" height="28" rx="10" fill="#D35400"/>
  <rect x="800" y="398" width="240" height="10" fill="#D35400"/>
  <text x="920" y="398" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">4. Sprint-Review / Demo</text>
  <text x="920" y="422" text-anchor="middle" font-size="10" fill="#D35400">Demo für DRK KV + LV</text>
  <text x="920" y="436" text-anchor="middle" font-size="10" fill="#333">Abnahme durch PO</text>
  <text x="920" y="450" text-anchor="middle" font-size="10" fill="#333">Feedback-Sammlung</text>
  <text x="920" y="464" text-anchor="middle" font-size="10" fill="#555">Dauer: 2 Std.</text>

  <!-- Phase 5: Pilot-Rollout (unten links) -->
  <rect x="80" y="540" width="220" height="90" rx="10" fill="#E8DAEF" stroke="#7D3C98" stroke-width="2" filter="url(#shadow)"/>
  <rect x="80" y="540" width="220" height="28" rx="10" fill="#7D3C98"/>
  <rect x="80" y="558" width="220" height="10" fill="#7D3C98"/>
  <text x="190" y="558" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">5. Pilot-Rollout</text>
  <text x="190" y="582" text-anchor="middle" font-size="10" fill="#4A235A">1 Pilot-KV zuerst</text>
  <text x="190" y="596" text-anchor="middle" font-size="10" fill="#333">Produktivbetrieb</text>
  <text x="190" y="610" text-anchor="middle" font-size="10" fill="#555">Monitoring · Support</text>

  <!-- Phase 6: Retrospektive + Release (unten rechts) -->
  <rect x="800" y="540" width="220" height="90" rx="10" fill="#FADBD8" stroke="#C0392B" stroke-width="2" filter="url(#shadow)"/>
  <rect x="800" y="540" width="220" height="28" rx="10" fill="#C0392B"/>
  <rect x="800" y="558" width="220" height="10" fill="#C0392B"/>
  <text x="910" y="558" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">6. Retrospektive + Release</text>
  <text x="910" y="582" text-anchor="middle" font-size="10" fill="#7B241C">Lessons Learned</text>
  <text x="910" y="596" text-anchor="middle" font-size="10" fill="#333">Release-Notes</text>
  <text x="910" y="610" text-anchor="middle" font-size="10" fill="#555">Nächster Zyklus-Start</text>

  <!-- ── MITTE: Product Backlog ── -->
  <rect x="380" y="360" width="340" height="140" rx="10" fill="#fff" stroke="#2E75B6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="380" y="360" width="340" height="30" rx="10" fill="#1F4E79"/>
  <rect x="380" y="380" width="340" height="10" fill="#1F4E79"/>
  <text x="550" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Gemeinsames Product Backlog</text>
  <text x="550" y="406" text-anchor="middle" font-size="10" fill="#333">GitHub Issues · Priorisiert von DRK LV MV PO</text>
  <text x="550" y="421" text-anchor="middle" font-size="10" fill="#555">Feature-Requests · Bug-Reports · CI/CD-Tasks</text>
  <text x="550" y="436" text-anchor="middle" font-size="10" fill="#555">KV-spezifische Anforderungen · Compliance-Tasks</text>
  <text x="550" y="451" text-anchor="middle" font-size="10" fill="#C0392B" font-weight="bold">Transparenz: alle Stakeholder haben Lesezugriff</text>
  <text x="550" y="466" text-anchor="middle" font-size="10" fill="#555">Schreibzugriff: DRK LV MV PO + ST COMPUTER GmbH</text>
  <text x="550" y="481" text-anchor="middle" font-size="10" fill="#555">Sprint-Planung: aus Backlog-Top je Sprint</text>

  <!-- ── PFEILE zwischen Phasen ── -->
  <!-- 1→2 (oben, links nach rechts) -->
  <line x1="300" y1="255" x2="800" y2="255" stroke="#2E75B6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="550" y="248" text-anchor="middle" font-size="10" fill="#2E75B6">Anforderungen → priorisiert</text>

  <!-- 2→3 (rechts oben → links Mitte) -->
  <path d="M 800 340 Q 550 360 300 420" stroke="#2E75B6" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <text x="550" y="370" text-anchor="middle" font-size="10" fill="#555">Sprint-Backlog</text>

  <!-- 3→4 (links Mitte → rechts Mitte) -->
  <line x1="300" y1="430" x2="800" y2="430" stroke="#1A5C1A" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="550" y="445" text-anchor="middle" font-size="10" fill="#1A5C1A">fertiges Inkrement</text>

  <!-- 4→5 (rechts Mitte → links unten) -->
  <path d="M 800 490 Q 550 520 300 570" stroke="#D35400" stroke-width="1.8" fill="none" marker-end="url(#arrow-orange)"/>
  <text x="550" y="535" text-anchor="middle" font-size="10" fill="#D35400">abgenommen → Rollout</text>

  <!-- 5→6 (links unten → rechts unten) -->
  <line x1="300" y1="585" x2="800" y2="585" stroke="#7D3C98" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="550" y="578" text-anchor="middle" font-size="10" fill="#7D3C98">Betriebserfahrung</text>

  <!-- 6→1 (Rückpfeil: rechts unten zurück nach links oben — Zyklus-Schluss) -->
  <path d="M 910 630 Q 1060 700 1060 250 Q 1060 170 910 154" stroke="#C0392B" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <text x="1072" y="430" font-size="10" fill="#C0392B" text-anchor="middle" transform="rotate(90,1072,430)">neuer Zyklus</text>

  <!-- 1→Backlog (links oben → Mitte) -->
  <line x1="300" y1="310" x2="390" y2="395" stroke="#2E75B6" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <!-- 4→Backlog (rechts Mitte → Mitte) -->
  <line x1="800" y1="430" x2="720" y2="430" stroke="#D35400" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-orange)"/>

  <!-- ── Zeitrahmen ── -->
  <rect x="360" y="680" width="380" height="80" rx="8" fill="#F0F4F8" stroke="#BBBBBB" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="550" y="700" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F4E79">Zyklus-Übersicht</text>
  <text x="550" y="718" text-anchor="middle" font-size="10" fill="#333">Sprint-Dauer: 2 Wochen  ·  Discovery-Workshop: alle 6 Wochen</text>
  <text x="550" y="733" text-anchor="middle" font-size="10" fill="#333">Pilot-Phase: 3–6 Monate (1 KV)  ·  Rollout alle KV: schrittweise</text>
  <text x="550" y="748" text-anchor="middle" font-size="10" fill="#C0392B" font-weight="bold">Go-Live-Kriterium: Pentest bestanden + DPO-Freigabe</text>

  <!-- ── Legende ── -->
  <rect x="60" y="680" width="280" height="118" rx="6" fill="#fff" stroke="#CCCCCC" stroke-width="1"/>
  <text x="80" y="700" font-size="11" font-weight="bold" fill="#333">Akteure</text>
  <rect x="80" y="710" width="14" height="14" rx="3" fill="#C0392B"/>
  <text x="100" y="721" font-size="10" fill="#333">DRK LV MV (Auftraggeber / PO)</text>
  <rect x="80" y="730" width="14" height="14" rx="3" fill="#2E75B6"/>
  <text x="100" y="741" font-size="10" fill="#333">DRK Kreisverbände (Nutzer / Feedback)</text>
  <rect x="80" y="750" width="14" height="14" rx="3" fill="#1A5C1A"/>
  <text x="100" y="761" font-size="10" fill="#333">ST COMPUTER GmbH (Entwicklung)</text>
  <rect x="80" y="770" width="14" height="14" rx="3" fill="#7D3C98"/>
  <text x="100" y="781" font-size="10" fill="#333">DRK-IT / Betrieb</text>

  <!-- Legende Pfeile -->
  <rect x="760" y="680" width="280" height="118" rx="6" fill="#fff" stroke="#CCCCCC" stroke-width="1"/>
  <text x="780" y="700" font-size="11" font-weight="bold" fill="#333">Übergaben</text>
  <line x1="780" y1="718" x2="810" y2="718" stroke="#2E75B6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="722" font-size="10" fill="#333">Anforderung / Backlog</text>
  <line x1="780" y1="738" x2="810" y2="738" stroke="#1A5C1A" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="820" y="742" font-size="10" fill="#333">Fertiges Inkrement</text>
  <line x1="780" y1="758" x2="810" y2="758" stroke="#D35400" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="820" y="762" font-size="10" fill="#333">Abnahme / Rollout</text>
  <line x1="780" y1="778" x2="810" y2="778" stroke="#C0392B" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="820" y="782" font-size="10" fill="#333">Neuer Zyklus (Retrospektive)</text>
</svg>
