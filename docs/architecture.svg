<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" width="2800" height="1760" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666666"/>
    </marker>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#235FA6"/>
    </marker>
    <marker id="arroworange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#C75B00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="880" fill="#FFFFFF"/>

  <!-- On-Premise-Grenze -->
  <rect x="40" y="128" width="1320" height="548" rx="14" fill="#F3F8F3" stroke="#2EA64C" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="58" y="153" font-size="20" font-weight="bold" fill="#1A7340">On-Premise · DGX Spark — alles lokal, kein Datenabfluss</text>

  <!-- Browser -->
  <rect x="300" y="28" width="360" height="68" rx="8" fill="#EAF1FA" stroke="#235FA6" stroke-width="2"/>
  <text x="480" y="58" font-size="20" font-weight="bold" fill="#235FA6" text-anchor="middle">Browser — Anwender</text>
  <text x="480" y="82" font-size="16" fill="#333333" text-anchor="middle">Chat, Wissensbasis</text>
  <rect x="740" y="28" width="360" height="68" rx="8" fill="#EAF1FA" stroke="#235FA6" stroke-width="2"/>
  <text x="920" y="58" font-size="20" font-weight="bold" fill="#235FA6" text-anchor="middle">Browser — Administrator</text>
  <text x="920" y="82" font-size="16" fill="#333333" text-anchor="middle">Verwaltung /admin</text>

  <!-- Caddy -->
  <rect x="460" y="148" width="480" height="58" rx="8" fill="#235FA6" stroke="#1B4A82" stroke-width="2"/>
  <text x="700" y="184" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Caddy — Reverse-Proxy (HTTPS :443)</text>

  <!-- Anwendungsschicht -->
  <rect x="90" y="262" width="350" height="86" rx="8" fill="#FFFFFF" stroke="#235FA6" stroke-width="2"/>
  <text x="265" y="292" font-size="19" font-weight="bold" fill="#235FA6" text-anchor="middle">Open WebUI  :3000</text>
  <text x="265" y="316" font-size="16" fill="#333333" text-anchor="middle">Chat-Oberfläche</text>
  <text x="265" y="336" font-size="16" fill="#333333" text-anchor="middle">Pipes (RAG / Modelle / ELO)</text>

  <rect x="525" y="262" width="350" height="86" rx="8" fill="#FFFFFF" stroke="#235FA6" stroke-width="2"/>
  <text x="700" y="292" font-size="19" font-weight="bold" fill="#235FA6" text-anchor="middle">API-Gateway  :8000</text>
  <text x="700" y="316" font-size="16" fill="#333333" text-anchor="middle">JWT-Prüfung, tenant_id</text>
  <text x="700" y="336" font-size="16" fill="#333333" text-anchor="middle">Verwaltung /admin</text>

  <rect x="960" y="262" width="350" height="86" rx="8" fill="#FFFFFF" stroke="#235FA6" stroke-width="2"/>
  <text x="1135" y="292" font-size="19" font-weight="bold" fill="#235FA6" text-anchor="middle">Keycloak  :8080</text>
  <text x="1135" y="316" font-size="16" fill="#333333" text-anchor="middle">Anmeldung / Rollen (SSO)</text>
  <text x="1135" y="336" font-size="16" fill="#333333" text-anchor="middle">optional Active Directory</text>

  <!-- Dienstschicht -->
  <rect x="90" y="412" width="290" height="84" rx="8" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/>
  <text x="235" y="440" font-size="18" font-weight="bold" fill="#333333" text-anchor="middle">RAG-Service  :8001</text>
  <text x="235" y="462" font-size="15" fill="#333333" text-anchor="middle">Vektorsuche, Reranking,</text>
  <text x="235" y="481" font-size="15" fill="#333333" text-anchor="middle">rechtegeprüfte Quellen</text>

  <rect x="410" y="412" width="270" height="84" rx="8" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/>
  <text x="545" y="440" font-size="18" font-weight="bold" fill="#333333" text-anchor="middle">LLM-Service  :8002</text>
  <text x="545" y="462" font-size="15" fill="#333333" text-anchor="middle">Modell-Routing</text>
  <text x="545" y="481" font-size="15" fill="#333333" text-anchor="middle">lokal / optional extern</text>

  <rect x="710" y="412" width="250" height="84" rx="8" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/>
  <text x="835" y="440" font-size="18" font-weight="bold" fill="#333333" text-anchor="middle">Connector  :8004</text>
  <text x="835" y="462" font-size="15" fill="#333333" text-anchor="middle">Registry,</text>
  <text x="835" y="481" font-size="15" fill="#333333" text-anchor="middle">Tenant-Freigaben</text>

  <rect x="990" y="412" width="290" height="84" rx="8" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/>
  <text x="1135" y="440" font-size="18" font-weight="bold" fill="#333333" text-anchor="middle">ELO-Connector  :8006</text>
  <text x="1135" y="462" font-size="15" fill="#333333" text-anchor="middle">Adapter zum ELO-DMS</text>
  <text x="1135" y="481" font-size="15" fill="#333333" text-anchor="middle">(nur lesend)</text>

  <!-- Daten- & KI-Schicht -->
  <rect x="90" y="566" width="370" height="88" rx="8" fill="#EAF1FA" stroke="#235FA6" stroke-width="2"/>
  <text x="275" y="596" font-size="18" font-weight="bold" fill="#235FA6" text-anchor="middle">PostgreSQL + pgvector  :5432</text>
  <text x="275" y="618" font-size="15" fill="#333333" text-anchor="middle">Index, Einstellungen, Audit</text>
  <text x="275" y="638" font-size="15" fill="#333333" text-anchor="middle">— enthält auch die Keycloak-Daten</text>

  <rect x="490" y="566" width="280" height="88" rx="8" fill="#EAF1FA" stroke="#235FA6" stroke-width="2"/>
  <text x="630" y="600" font-size="18" font-weight="bold" fill="#235FA6" text-anchor="middle">MinIO  :9000</text>
  <text x="630" y="624" font-size="15" fill="#333333" text-anchor="middle">Original-Dokumente</text>

  <rect x="800" y="566" width="480" height="88" rx="8" fill="#E8F5EC" stroke="#2EA64C" stroke-width="2"/>
  <text x="1040" y="596" font-size="18" font-weight="bold" fill="#1A7340" text-anchor="middle">Ollama  :11434  (lokal, GPU/GB10)</text>
  <text x="1040" y="618" font-size="15" fill="#333333" text-anchor="middle">Qwen3 32B (Antworten)</text>
  <text x="1040" y="638" font-size="15" fill="#333333" text-anchor="middle">nomic-embed-text (Embeddings)</text>

  <!-- Externe Systeme (ausserhalb On-Premise) -->
  <rect x="490" y="724" width="360" height="74" rx="8" fill="#FBF0E6" stroke="#C75B00" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="670" y="752" font-size="17" font-weight="bold" fill="#C75B00" text-anchor="middle">Externe Modelle (OpenAI / Anthropic)</text>
  <text x="670" y="775" font-size="15" fill="#333333" text-anchor="middle">optional · standardmäßig AUS · DSB-Freigabe</text>

  <rect x="990" y="724" width="290" height="74" rx="8" fill="#FBF0E6" stroke="#C75B00" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1135" y="752" font-size="17" font-weight="bold" fill="#C75B00" text-anchor="middle">ELO-DMS (Bestandssystem)</text>
  <text x="1135" y="775" font-size="15" fill="#333333" text-anchor="middle">nur lesend</text>

  <!-- Verbindungen -->
  <line x1="480" y1="96" x2="620" y2="146" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="96" x2="780" y2="146" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="620" y1="206" x2="320" y2="260" stroke="#235FA6" stroke-width="2" marker-end="url(#arrowblue)"/>
  <line x1="700" y1="206" x2="700" y2="260" stroke="#235FA6" stroke-width="2" marker-end="url(#arrowblue)"/>
  <line x1="800" y1="206" x2="1090" y2="260" stroke="#235FA6" stroke-width="2" marker-end="url(#arrowblue)"/>

  <line x1="440" y1="300" x2="523" y2="300" stroke="#235FA6" stroke-width="2.5" marker-end="url(#arrowblue)"/>
  <text x="482" y="292" font-size="14" fill="#235FA6" text-anchor="middle">OIDC-Token</text>

  <line x1="640" y1="348" x2="300" y2="410" stroke="#666666" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="690" y1="348" x2="560" y2="410" stroke="#666666" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="760" y1="348" x2="820" y2="410" stroke="#666666" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="820" y1="348" x2="1110" y2="410" stroke="#666666" stroke-width="1.8" marker-end="url(#arrow)"/>

  <line x1="235" y1="496" x2="270" y2="564" stroke="#666666" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="300" y1="496" x2="600" y2="564" stroke="#666666" stroke-width="1.8" marker-end="url(#arrow)"/>

  <line x1="600" y1="496" x2="980" y2="564" stroke="#666666" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="560" y1="496" x2="650" y2="722" stroke="#C75B00" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arroworange)"/>

  <line x1="1135" y1="496" x2="1135" y2="722" stroke="#C75B00" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arroworange)"/>
  <line x1="960" y1="454" x2="990" y2="454" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
