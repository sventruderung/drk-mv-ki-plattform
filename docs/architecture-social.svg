<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" width="1100" height="860" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E75B6"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#228B22"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E67E22"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="860" fill="#F7F9FC"/>

  <!-- Title -->
  <text x="550" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F4E79">DRK MV KI-Plattform — Social-Media-Modul (P-02)</text>
  <text x="550" y="56" text-anchor="middle" font-size="12" fill="#888">ST COMPUTER GmbH · KI-gestützte Öffentlichkeitsarbeit für DRK-Kreisverbände · Version 0.1.0</text>
  <line x1="60" y1="66" x2="1040" y2="66" stroke="#2E75B6" stroke-width="2"/>

  <!-- ── LAYER 1: Nutzer ── -->
  <rect x="200" y="82" width="700" height="52" rx="8" fill="#D6E4F0" filter="url(#shadow)"/>
  <text x="550" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F4E79">Öffentlichkeitsbeauftragte · Presse-Mitarbeitende — DRK-Kreisverbände MV</text>
  <text x="550" y="121" text-anchor="middle" font-size="11" fill="#555">Browser / Tablet · lokales Netz oder VPN · Authentifizierung via Keycloak SSO</text>

  <!-- Arrow down -->
  <line x1="550" y1="134" x2="550" y2="162" stroke="#2E75B6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="575" y="152" font-size="10" fill="#555">HTTPS</text>

  <!-- ── LAYER 2: Open WebUI ── -->
  <rect x="300" y="162" width="500" height="44" rx="8" fill="#1F4E79" filter="url(#shadow)"/>
  <text x="550" y="181" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Open WebUI</text>
  <text x="550" y="197" text-anchor="middle" font-size="11" fill="#AED6F1">Chat · Social-Media-Templates · Prompt-Assistenz · Vorschau-Anzeige</text>

  <!-- Arrow down -->
  <line x1="550" y1="206" x2="550" y2="234" stroke="#2E75B6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="575" y="224" font-size="10" fill="#555">REST · JWT</text>

  <!-- ── LAYER 3: API Gateway ── -->
  <rect x="120" y="234" width="860" height="52" rx="8" fill="#2E75B6" filter="url(#shadow)"/>
  <text x="550" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">API-Gateway  (Port 8000)</text>
  <text x="550" y="273" text-anchor="middle" font-size="11" fill="#D6E4F0">JWT-Validierung · Mandantenisolation (tenant_id aus JWT) · Routing · Rate-Limiting</text>

  <!-- Arrows down to services -->
  <line x1="240" y1="286" x2="200" y2="330" stroke="#2E75B6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="440" y1="286" x2="430" y2="330" stroke="#2E75B6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="660" y1="286" x2="660" y2="330" stroke="#2E75B6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- Arrow to new content-service (orange) -->
  <line x1="860" y1="286" x2="900" y2="330" stroke="#E67E22" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- ── LAYER 4: Services ── -->
  <!-- RAG Service -->
  <rect x="80" y="330" width="230" height="76" rx="8" fill="#EAF2FB" stroke="#2E75B6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="195" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F4E79">RAG-Service  :8001</text>
  <text x="195" y="368" text-anchor="middle" font-size="10" fill="#444">Dokument-Ingest</text>
  <text x="195" y="382" text-anchor="middle" font-size="10" fill="#444">Embedding · Vektor-Suche</text>
  <text x="195" y="396" text-anchor="middle" font-size="10" fill="#444">Zitierungspflicht</text>

  <!-- LLM Service -->
  <rect x="330" y="330" width="230" height="76" rx="8" fill="#EAF2FB" stroke="#2E75B6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="445" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F4E79">LLM-Service  :8002</text>
  <text x="445" y="368" text-anchor="middle" font-size="10" fill="#444">Inferenz-Proxy · Streaming</text>
  <text x="445" y="382" text-anchor="middle" font-size="10" fill="#444">Modell-Routing</text>
  <text x="445" y="396" text-anchor="middle" font-size="10" fill="#444">Timeout-Handling</text>

  <!-- Admin Service -->
  <rect x="580" y="330" width="230" height="76" rx="8" fill="#EAF2FB" stroke="#2E75B6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="695" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F4E79">Admin-Service  :8003</text>
  <text x="695" y="368" text-anchor="middle" font-size="10" fill="#444">Mandanten-Verwaltung</text>
  <text x="695" y="382" text-anchor="middle" font-size="10" fill="#444">Keycloak Provisioning</text>
  <text x="695" y="396" text-anchor="middle" font-size="10" fill="#444">Audit-Log</text>

  <!-- NEW: Content Service (orange highlight) -->
  <rect x="810" y="320" width="250" height="96" rx="8" fill="#FEF9E7" stroke="#E67E22" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="810" y="320" width="250" height="24" rx="8" fill="#E67E22"/>
  <rect x="810" y="336" width="250" height="8" fill="#E67E22"/>
  <text x="935" y="337" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">NEU: Content-Service  :8005</text>
  <text x="935" y="358" text-anchor="middle" font-size="10" fill="#7D6608">Post-Generierung (Multi-Kanal)</text>
  <text x="935" y="372" text-anchor="middle" font-size="10" fill="#7D6608">DRK-CI-Validierung · Ton-Check</text>
  <text x="935" y="386" text-anchor="middle" font-size="10" fill="#7D6608">Genehmigungsworkflow</text>
  <text x="935" y="400" text-anchor="middle" font-size="10" fill="#E74C3C" font-weight="bold">Keine Sozialdaten — öffentl. Komm.</text>

  <!-- Internal arrows: content-service → llm-service and rag-service -->
  <line x1="810" y1="368" x2="560" y2="368" stroke="#E67E22" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-orange)"/>
  <text x="680" y="362" font-size="9" fill="#E67E22">LLM-Aufruf</text>
  <line x1="810" y1="380" x2="310" y2="380" stroke="#228B22" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-green)"/>
  <text x="540" y="392" font-size="9" fill="#228B22">CI-Referenzen aus RAG</text>

  <!-- Arrows down to infra -->
  <line x1="195" y1="406" x2="195" y2="464" stroke="#888" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <line x1="445" y1="406" x2="500" y2="464" stroke="#888" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <line x1="695" y1="406" x2="695" y2="464" stroke="#888" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <line x1="935" y1="416" x2="935" y2="464" stroke="#E67E22" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- ── LAYER 5: Infrastruktur ── -->
  <rect x="60" y="464" width="980" height="160" rx="8" fill="#F0F4F8" stroke="#BBBBBB" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="486" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">Infrastruktur — On-Premise / Private Cloud Deutschland · Docker Compose → K3s</text>

  <!-- PostgreSQL -->
  <rect x="80" y="496" width="220" height="112" rx="6" fill="#fff" stroke="#2E75B6" stroke-width="1.5"/>
  <rect x="80" y="496" width="220" height="28" rx="6" fill="#2E75B6"/>
  <rect x="80" y="514" width="220" height="10" fill="#2E75B6"/>
  <text x="190" y="514" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">PostgreSQL 16 + pgvector</text>
  <text x="190" y="540" text-anchor="middle" font-size="10" fill="#333">Row-Level Security (RLS)</text>
  <text x="190" y="555" text-anchor="middle" font-size="10" fill="#333">Mandantenisolation · Vektoren</text>
  <text x="190" y="570" text-anchor="middle" font-size="10" fill="#E74C3C" font-weight="bold">DSGVO Art. 9 · § 35 SGB I</text>
  <text x="190" y="585" text-anchor="middle" font-size="10" fill="#555">+ content_drafts Tabelle</text>
  <text x="190" y="600" text-anchor="middle" font-size="10" fill="#555">Approval-Status pro Post</text>

  <!-- Ollama -->
  <rect x="320" y="496" width="220" height="112" rx="6" fill="#fff" stroke="#2E75B6" stroke-width="1.5"/>
  <rect x="320" y="496" width="220" height="28" rx="6" fill="#2E75B6"/>
  <rect x="320" y="514" width="220" height="10" fill="#2E75B6"/>
  <text x="430" y="514" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Ollama + lokale LLMs</text>
  <text x="430" y="540" text-anchor="middle" font-size="10" fill="#333">Qwen3 30B-A3B Q4 (primär)</text>
  <text x="430" y="555" text-anchor="middle" font-size="10" fill="#333">Llama 3.1 8B (Social Draft)</text>
  <text x="430" y="570" text-anchor="middle" font-size="10" fill="#E74C3C" font-weight="bold">Zero-Data-Leak · kein ext. API</text>
  <text x="430" y="585" text-anchor="middle" font-size="10" fill="#333">keep_alive: Modell im RAM</text>
  <text x="430" y="600" text-anchor="middle" font-size="10" fill="#555">Streaming SSE · TTFT &lt; 2s</text>

  <!-- Keycloak -->
  <rect x="560" y="496" width="220" height="112" rx="6" fill="#fff" stroke="#2E75B6" stroke-width="1.5"/>
  <rect x="560" y="496" width="220" height="28" rx="6" fill="#2E75B6"/>
  <rect x="560" y="514" width="220" height="10" fill="#2E75B6"/>
  <text x="670" y="514" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Keycloak 24</text>
  <text x="670" y="540" text-anchor="middle" font-size="10" fill="#333">Multi-Tenant OIDC / OAuth2</text>
  <text x="670" y="555" text-anchor="middle" font-size="10" fill="#333">Realm pro KV · AD-Integration</text>
  <text x="670" y="570" text-anchor="middle" font-size="10" fill="#333">Rolle: content-editor</text>
  <text x="670" y="585" text-anchor="middle" font-size="10" fill="#333">Rolle: content-approver</text>
  <text x="670" y="600" text-anchor="middle" font-size="10" fill="#555">SSO für alle KV-Mitarbeitende</text>

  <!-- NEW: MinIO (content assets) -->
  <rect x="800" y="496" width="220" height="112" rx="6" fill="#FEF9E7" stroke="#E67E22" stroke-width="2"/>
  <rect x="800" y="496" width="220" height="28" rx="6" fill="#E67E22"/>
  <rect x="800" y="514" width="220" height="10" fill="#E67E22"/>
  <text x="910" y="514" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">MinIO — Content Assets</text>
  <text x="910" y="540" text-anchor="middle" font-size="10" fill="#7D6608">DRK-Logos · CI-Vorlagen</text>
  <text x="910" y="555" text-anchor="middle" font-size="10" fill="#7D6608">Bilder für Posts · Templates</text>
  <text x="910" y="570" text-anchor="middle" font-size="10" fill="#228B22" font-weight="bold">On-Premise S3-kompatibel</text>
  <text x="910" y="585" text-anchor="middle" font-size="10" fill="#7D6608">Bucket: drk-content-{tenant}</text>
  <text x="910" y="600" text-anchor="middle" font-size="10" fill="#555">Keine personenbez. Daten</text>

  <!-- ── LAYER 6: Social-Media-Kanäle (output) ── -->
  <rect x="60" y="646" width="980" height="118" rx="8" fill="#E8F8E8" stroke="#228B22" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="668" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A5C1A">Ausgabe-Kanäle — Manuell nach Freigabe durch content-approver</text>

  <!-- Facebook -->
  <rect x="80" y="678" width="170" height="74" rx="6" fill="#fff" stroke="#1877F2" stroke-width="2"/>
  <text x="165" y="698" text-anchor="middle" font-size="11" font-weight="bold" fill="#1877F2">Facebook</text>
  <text x="165" y="714" text-anchor="middle" font-size="10" fill="#333">DRK KV Seiten</text>
  <text x="165" y="728" text-anchor="middle" font-size="10" fill="#555">Posting-API optional</text>
  <text x="165" y="742" text-anchor="middle" font-size="10" fill="#888">(Freigabe-Pflicht)</text>

  <!-- Instagram -->
  <rect x="270" y="678" width="170" height="74" rx="6" fill="#fff" stroke="#E1306C" stroke-width="2"/>
  <text x="355" y="698" text-anchor="middle" font-size="11" font-weight="bold" fill="#E1306C">Instagram</text>
  <text x="355" y="714" text-anchor="middle" font-size="10" fill="#333">Bild + Caption</text>
  <text x="355" y="728" text-anchor="middle" font-size="10" fill="#555">Hashtag-Vorschläge</text>
  <text x="355" y="742" text-anchor="middle" font-size="10" fill="#888">(Copy → manuell posten)</text>

  <!-- LinkedIn -->
  <rect x="460" y="678" width="170" height="74" rx="6" fill="#fff" stroke="#0A66C2" stroke-width="2"/>
  <text x="545" y="698" text-anchor="middle" font-size="11" font-weight="bold" fill="#0A66C2">LinkedIn</text>
  <text x="545" y="714" text-anchor="middle" font-size="10" fill="#333">DRK-Unternehmensseite</text>
  <text x="545" y="728" text-anchor="middle" font-size="10" fill="#555">Professioneller Ton</text>
  <text x="545" y="742" text-anchor="middle" font-size="10" fill="#888">(Freigabe-Pflicht)</text>

  <!-- Intranet/Website -->
  <rect x="650" y="678" width="170" height="74" rx="6" fill="#fff" stroke="#2E75B6" stroke-width="2"/>
  <text x="735" y="698" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E75B6">DRK-Webseite</text>
  <text x="735" y="714" text-anchor="middle" font-size="10" fill="#333">Pressemitteilungen</text>
  <text x="735" y="728" text-anchor="middle" font-size="10" fill="#555">News-Beiträge CMS</text>
  <text x="735" y="742" text-anchor="middle" font-size="10" fill="#888">(Export als HTML/Markdown)</text>

  <!-- Newsletter -->
  <rect x="840" y="678" width="170" height="74" rx="6" fill="#fff" stroke="#6C3483" stroke-width="2"/>
  <text x="925" y="698" text-anchor="middle" font-size="11" font-weight="bold" fill="#6C3483">Newsletter / E-Mail</text>
  <text x="925" y="714" text-anchor="middle" font-size="10" fill="#333">Spendenkampagnen</text>
  <text x="925" y="728" text-anchor="middle" font-size="10" fill="#555">Mitglieder-Info</text>
  <text x="925" y="742" text-anchor="middle" font-size="10" fill="#888">(DSGVO: nur Opt-in)</text>

  <!-- Arrow from content-service to output layer -->
  <line x1="935" y1="608" x2="935" y2="638" stroke="#E67E22" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="945" y="628" font-size="9" fill="#E67E22">Freigabe</text>
  <line x1="850" y1="645" x2="550" y2="645" stroke="#228B22" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="550" y1="645" x2="165" y2="672" stroke="#228B22" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-green)"/>
  <line x1="550" y1="645" x2="355" y2="672" stroke="#228B22" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-green)"/>
  <line x1="550" y1="645" x2="545" y2="672" stroke="#228B22" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-green)"/>
  <line x1="550" y1="645" x2="735" y2="672" stroke="#228B22" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-green)"/>
  <line x1="550" y1="645" x2="925" y2="672" stroke="#228B22" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-green)"/>

  <!-- Legende -->
  <rect x="60" y="776" width="980" height="70" rx="6" fill="#FFF8E1" stroke="#F0C040" stroke-width="1.2"/>
  <text x="80" y="798" font-size="11" font-weight="bold" fill="#7D6608">Legende:  </text>
  <line x1="160" y1="793" x2="210" y2="793" stroke="#E67E22" stroke-width="2.5"/>
  <text x="215" y="798" font-size="10" fill="#555">Neuer Content-Service (P-02)</text>
  <line x1="380" y1="793" x2="430" y2="793" stroke="#228B22" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="435" y="798" font-size="10" fill="#555">Interne Service-Aufrufe</text>
  <line x1="580" y1="793" x2="630" y2="793" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="635" y="798" font-size="10" fill="#555">Bestehende Architektur (unverändert)</text>
  <text x="80" y="820" font-size="10" fill="#7D6608"><tspan font-weight="bold">Datenschutz: </tspan>Öffentlichkeitskommunikation enthält keine Sozialdaten (Art. 9 DSGVO) · Geringeres Compliance-Risiko als RAG-Kern · Newsletter nur mit Opt-in (DSGVO Art. 6 Abs. 1a)</text>
  <text x="80" y="836" font-size="10" fill="#7D6608"><tspan font-weight="bold">Freigabe-Pflicht: </tspan>Alle KI-generierten Posts werden von content-approver (Rolle in Keycloak) geprüft und manuell freigegeben — keine automatische Veröffentlichung</text>
</svg>
