services:

  # ---------------------------------------------------------------------------
  # Infrastruktur
  # ---------------------------------------------------------------------------

  caddy:
    restart: unless-stopped
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.org}
    volumes:
      # Rein internes Netz ohne Internet: CADDY_CONFIG=Caddyfile-internal in
      # der .env setzen (interne CA statt Let's Encrypt, siehe Datei-Kopf)
      - ./infra/caddy/${CADDY_CONFIG:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api-gateway
      - open-webui

  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    restart: unless-stopped
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Log-Level. Für die Fehlersuche in der AD-Federation in .env setzen:
      # KC_LOG_LEVEL=INFO,org.keycloak.storage.ldap:debug  (danach wieder leeren)
      KC_LOG_LEVEL: ${KC_LOG_LEVEL:-INFO}
      # Hinter Caddy unter /auth erreichbar (HTTPS terminiert am Proxy)
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      # Truststore für ausgehendes TLS — nötig für LDAPS zum DC. Ab Server 2019
      # erzwingt AD LDAP-Signing; unsignierte Binds auf 389 werden abgelehnt
      # (error code 8). Ablauf: DC-LDAPS-Zertifikat als PEM in
      # infra/keycloak/truststore/ ablegen, dann in .env aktivieren:
      #   KC_TRUSTSTORE_PATHS=/opt/keycloak/conf/truststore
      # und die Federation-connectionUrl auf ldaps://<dc>:636 stellen.
      # Leer (Standard) = kein Truststore, damit Installationen ohne AD sauber
      # starten.
      KC_TRUSTSTORE_PATHS: ${KC_TRUSTSTORE_PATHS:-}
    volumes:
      - ./infra/keycloak/config:/opt/keycloak/data/import:ro
      - ./infra/keycloak/truststore:/opt/keycloak/conf/truststore:ro
      # Optionales DRK-Login-Theme (Logo auf der Anmeldeseite). Verfügbar, aber
      # INAKTIV, bis im Realm bewusst "Login theme = drk" gesetzt wird — die
      # produktive Anmeldung bleibt sonst unverändert. Logo kommt aus
      # data/branding (dasselbe Bild wie im Verwaltungs-UI hochgeladen).
      - ./infra/keycloak/themes:/opt/keycloak/themes:ro
      - ./data/branding:/opt/keycloak/themes/drk/login/resources/img:ro
    # Domänencontroller-Name dauerhaft auflösen (AD/LDAP-Federation) — sonst
    # scheitern AD-Logins UND das Anlegen lokaler Nutzer (Duplikat-Prüfung
    # fragt das AD). IP in .env pflegen: AD_SERVER_HOST + AD_SERVER_IP.
    extra_hosts:
      - "${AD_SERVER_HOST:-dc01.drkkvdbr.local}:${AD_SERVER_IP:-127.0.0.1}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    restart: unless-stopped
    image: ollama/ollama:latest
    environment:
      # Modell dauerhaft im Speicher halten — Neuladen kostet sonst ~10 s TTFT
      OLLAMA_KEEP_ALIVE: "-1"
      # Höchstens 2 Modelle gleichzeitig geladen = EIN großes Sprachmodell +
      # das kleine Embedding-Modell. Verhindert, dass mehrere große LLMs den
      # (unified) Speicher füllen und Modelle auf die CPU ausweichen (langsam).
      # Beim Wechsel des Standardmodells wird das alte automatisch verdrängt.
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # COMPLIANCE: Kein externes Netz-Routing — Modelle bleiben lokal
    # DGX Spark: GPU-Zugriff fürs GB10 (NVIDIA Container Toolkit vorinstalliert)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  minio:
    restart: unless-stopped
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  open-webui:
    restart: unless-stopped
    image: ghcr.io/open-webui/open-webui:main
    environment:
      # Open WebUI spricht direkt mit Ollama; Auth via Keycloak (OIDC)
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: "true"
      ENABLE_OAUTH_SIGNUP: "true"
      OAUTH_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      OPENID_PROVIDER_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/${KEYCLOAK_REALM}/.well-known/openid-configuration
      OAUTH_PROVIDER_NAME: "DRK Login"
      # Deutsche Oberfläche als Standard für neue Nutzer
      DEFAULT_LOCALE: "de-DE"
      # Deutsche Prompt-Vorschläge auf der Startseite (greift bei Erstinstallation;
      # bei laufender Instanz: Admin-Panel → Einstellungen → Oberfläche)
      DEFAULT_PROMPT_SUGGESTIONS: >-
        [{"title": ["E-Mail formulieren", "freundlich und professionell"],
          "content": "Formuliere eine freundliche Antwort auf folgende E-Mail:\n\n"},
         {"title": ["Text zusammenfassen", "in 5 Stichpunkten"],
          "content": "Fasse den folgenden Text in 5 Stichpunkten zusammen:\n\n"},
         {"title": ["Einfache Sprache", "barrierefrei umformulieren"],
          "content": "Übertrage den folgenden Text in Einfache Sprache:\n\n"},
         {"title": ["Protokoll strukturieren", "Beschlüsse und Aufgaben"],
          "content": "Strukturiere diese Besprechungsnotizen als Protokoll mit Beschlüssen und Aufgaben:\n\n"},
         {"title": ["Social-Media-Idee", "Stichpunkte für einen Beitrag"],
          "content": "Hilf mir, Stichpunkte für einen Social-Media-Beitrag zu folgendem Anlass zu sammeln:\n\n"}]
      # RAG-Pipe: ID-Token als Cookie bereitstellen, damit die Pipe es ans Gateway durchreichen kann
      ENABLE_OAUTH_ID_TOKEN_COOKIE: "true"
      # DRK-Login mit bestehendem lokalen Konto gleicher E-Mail verknüpfen
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
      # Keycloak-Nutzer sind bereits autorisiert — keine zweite Freigabe in Open WebUI
      DEFAULT_USER_ROLE: "user"
      # Modell-Sichtbarkeit steuert unsere Plattform (Gateway/Keycloak) —
      # Open WebUIs eigene Modell-Zugriffskontrolle deshalb aus
      BYPASS_MODEL_ACCESS_CONTROL: "true"
      # Nur DRK Login anzeigen — lokales E-Mail/Passwort-Formular ausblenden
      # (das technische Admin-Konto meldet sich via API an, setup_openwebui.py)
      ENABLE_LOGIN_FORM: "false"
      # Interne Caddy-CA (CADDY_CONFIG=Caddyfile-internal): httpx im Container
      # nutzt sonst nur das certifi-Bündel und lehnt die interne CA ab →
      # OIDC-Token-Tausch scheitert mit CERTIFICATE_VERIFY_FAILED.
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    # Beim Start die interne Caddy-Root-CA (falls vorhanden) ins System-
    # Truststore übernehmen — nötig für den OIDC-Token-Tausch über https.
    # Zusätzlich IPv4 bevorzugen (gai.conf): sonst gewinnt eine externe
    # AAAA-Auflösung (DynDNS/IPv6) gegen den IPv4-hosts-Eintrag von extra_hosts.
    command: >-
      bash -c "if [ -f /caddy-data/caddy/pki/authorities/local/root.crt ]; then
      cp /caddy-data/caddy/pki/authorities/local/root.crt /usr/local/share/ca-certificates/caddy-root-ca.crt
      && update-ca-certificates; fi;
      printf 'precedence ::ffff:0:0/96  100\n' > /etc/gai.conf;
      exec bash start.sh"
    # Öffentlichen Hostnamen IM Container auf den eigenen Host (Caddy) zeigen
    # lassen. Ohne das kann externes DNS (z.B. DynDNS/IPv6) den Token-Tausch
    # zum falschen Server schicken. In .env: PUBLIC_HOSTNAME=<hostname>.
    extra_hosts:
      - "${PUBLIC_HOSTNAME:-public-hostname.invalid}:host-gateway"
    volumes:
      - open_webui_data:/app/backend/data
      # Caddy-Datenverzeichnis (nur lesend) — enthält die interne Root-CA
      - caddy_data:/caddy-data:ro
      # Branding: Splash/Logo/Favicon über die Open-WebUI-Assets legen.
      # Quelle ist das Datenverzeichnis ./data/branding (im UI änderbar,
      # Einstellungen → Eigenes Logo); Standard-Dateien werden beim ersten
      # Gateway-Start aus infra/openwebui/branding dorthin kopiert.
      # WICHTIG: ./data/branding muss VOR dem ersten Start befüllt sein
      # (macht setup_dgx.sh) — Docker legt fehlende Datei-Mounts sonst als
      # Verzeichnisse an.
      - ./data/branding/splash.png:/app/build/static/splash.png:ro
      - ./data/branding/splash.png:/app/backend/open_webui/static/splash.png:ro
      - ./data/branding/favicon.png:/app/build/static/favicon.png:ro
      - ./data/branding/favicon.png:/app/build/favicon.png:ro
      - ./data/branding/favicon.png:/app/backend/open_webui/static/favicon.png:ro
      - ./data/branding/logo.png:/app/build/static/logo.png:ro
    ports:
      - "3000:8080"
    depends_on:
      - ollama
      - keycloak

  # ---------------------------------------------------------------------------
  # Applikations-Services
  # ---------------------------------------------------------------------------

  api-gateway:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    volumes:
      # System-Steuerung (Neustart/Herunterfahren) aus dem Verwaltungs-UI —
      # root-aequivalent, daher kv-admin-geschuetzt und auditiert
      - /var/run/docker.sock:/var/run/docker.sock
      # Branding: Standard-Logos (ro) + Datenverzeichnis für eigene Logos (rw).
      # Upload im UI (Einstellungen → Eigenes Logo) schreibt in-place nach
      # /app/branding — Keycloak-Theme und Open WebUI lesen dieselben Dateien.
      - ./infra/openwebui/branding:/app/branding-defaults:ro
      - ./data/branding:/app/branding
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      RAG_SERVICE_URL: http://rag-service:${RAG_SERVICE_PORT}
      LLM_SERVICE_URL: http://llm-service:${LLM_SERVICE_PORT}
      ADMIN_SERVICE_URL: http://admin-service:${ADMIN_SERVICE_PORT}
      CONTENT_SERVICE_URL: http://content-service:${CONTENT_SERVICE_PORT:-8005}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      # Konfigurierte Modelle — der Systemstatus prüft genau diese (kein fester
      # qwen3-Zwang mehr; auf einem llama3.3-Server bleibt der Status grün)
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL}
      OLLAMA_ELO_MODEL: ${OLLAMA_ELO_MODEL:-qwen3:8b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  rag-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/rag-service/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${RAG_SERVICE_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  llm-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/llm-service/Dockerfile
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${LLM_SERVICE_PORT:-8002}:8002"
    depends_on:
      - ollama
      - postgres

  # Connector-Registry (Gesamtkonzept §2): verwaltet Connectoren + Tenant-Freigaben,
  # prüft Mandant/Capability, proxyt an die Adapter. Ports nur lokal (Zugang über Gateway).
  connector-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/connector-service/Dockerfile
    environment:
      TENANT_ID: ${TENANT_ID:-kv-bad-doberan}
      ELO_CONNECTOR_URL: http://elo-connector:8005
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "127.0.0.1:8004:8004"
    depends_on:
      - elo-connector

  # ELO-DMS-Adapter: liest die ELO-Verbindung aus dem Secret-Store (system_settings,
  # gepflegt in der Admin-Console), spricht den ELO REST Service an. Read-only.
  elo-connector:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/elo-connector/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL}
    # Interner ELO-Server-Name dauerhaft auflösen (überlebt Reboot/OS-Update).
    # IP in .env pflegen: ELO_SERVER_HOST + ELO_SERVER_IP
    extra_hosts:
      - "${ELO_SERVER_HOST:-elo-srv.drkkvdbr.local}:${ELO_SERVER_IP:-127.0.0.1}"
    ports:
      # Host 8006 -> Container 8005 (8005 ist am Host vom content-service belegt)
      - "127.0.0.1:8006:8005"
    depends_on:
      postgres:
        condition: service_healthy

  # Für den Mono-Piloten deaktiviert: noch ohne Funktionalität (nur Skeleton).
  # Wird mit dem No-Code-Prompt-Management (§5.2) wieder aktiviert.
  admin-service:
    restart: unless-stopped
    profiles: ["full"]
    build:
      context: .
      dockerfile: services/admin-service/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${ADMIN_SERVICE_PORT:-8003}:8003"
    depends_on:
      postgres:
        condition: service_healthy

  content-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/content-service/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LLM_SERVICE_URL: http://llm-service:${LLM_SERVICE_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${CONTENT_SERVICE_PORT:-8005}:8005"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
  minio_data:
  open_webui_data:
  caddy_data:
  caddy_config:
