[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "minio>=7.2",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "striprtf>=0.0.26",
    "python-pptx>=1.0",
    "odfpy>=1.4",
    "extract-msg>=0.48",
    "pytesseract>=0.3.10",
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.3",
    "structlog>=24.2",
    "drk-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
